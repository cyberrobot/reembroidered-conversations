name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      DATABASE_URL: postgresql://reembroidered:reembroidered@localhost:5432/reembroidered?schema=public
      DATABASE_SCHEMA_TEST_URL: postgresql://reembroidered:reembroidered@localhost:5432/reembroidered?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reembroidered
          POSTGRES_PASSWORD: reembroidered
          POSTGRES_DB: reembroidered
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reembroidered -d reembroidered"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The repository has no Node version pin; Node 22 is the stable line matching @types/node.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Run Node tests
        run: npm test

      - name: Run type checking
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:browser

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
